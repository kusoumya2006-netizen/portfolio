<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 550" width="100%" height="100%">
  <defs>
    <linearGradient id="certGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E1A"/>
      <stop offset="50%" stop-color="#1C2C24"/>
      <stop offset="100%" stop-color="#101714"/>
    </linearGradient>
  </defs>

  <rect width="750" height="550" fill="url(#certGrad)"/>

  <!-- Ornate Certificate Guilloche Borders -->
  <rect x="25" y="25" width="700" height="500" fill="none" stroke="#9AA58B" stroke-width="1.5" opacity="0.4" rx="4"/>
  <rect x="35" y="35" width="680" height="480" fill="none" stroke="#D8D0BD" stroke-width="0.8" opacity="0.3" rx="2"/>
  
  <!-- Corner Ornaments -->
  <path d="M 40 60 L 60 40 M 40 40 L 70 40 M 40 40 L 40 70" stroke="#9AA58B" stroke-width="1.5" fill="none"/>
  <path d="M 710 60 L 690 40 M 710 40 L 680 40 M 710 40 L 710 70" stroke="#9AA58B" stroke-width="1.5" fill="none"/>
  <path d="M 40 490 L 60 510 M 40 510 L 70 510 M 40 510 L 40 480" stroke="#9AA58B" stroke-width="1.5" fill="none"/>
  <path d="M 710 490 L 690 510 M 710 510 L 680 510 M 710 510 L 710 480" stroke="#9AA58B" stroke-width="1.5" fill="none"/>

  <!-- Top Metadata -->
  <text x="375" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#9AA58B" letter-spacing="4">INSTITUTIONAL TECHNICAL TRAINING PROGRAM</text>
  <text x="700" y="55" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#D8D0BD" opacity="0.5">MOD-05 · 11 PAGES</text>

  <!-- Certificate Heading -->
  <text x="375" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="38" fill="#D8D0BD" font-weight="bold" letter-spacing="2">STTP CERTIFICATE</text>
  <text x="375" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#9AA58B" font-style="italic">SERIES</text>

  <!-- Subtitle -->
  <text x="375" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#D8D0BD" opacity="0.8">Short Term Training Program (STTP) Formal Accreditation Suite</text>

  <!-- Horizontal divider -->
  <line x1="200" y1="245" x2="550" y2="245" stroke="#9AA58B" stroke-width="0.8" opacity="0.5"/>

  <!-- Decorative Institutional Seal & Grid -->
  <g transform="translate(375, 340)">
    <!-- Starburst Seal -->
    <circle cx="0" cy="0" r="48" fill="#141E1A" stroke="#9AA58B" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#D8D0BD" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#D8D0BD" font-weight="bold">★</text>
    <text x="0" y="22" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#9AA58B" letter-spacing="2">VERIFIED</text>
    
    <!-- Ribbons -->
    <path d="M -15 45 L -20 80 L 0 68 L 20 80 L 15 45 Z" fill="#9AA58B" opacity="0.3"/>
  </g>

  <!-- Certificate Series Specs -->
  <g transform="translate(60, 460)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="10" fill="#B5B5AD">SERIES: 11 MULTI-VARIANT TEMPLATES</text>
    <text x="0" y="18" font-family="'Courier New', monospace" font-size="10" fill="#B5B5AD">TYPOGRAPHY: DIPLOMATIC SERIF &amp; METRIC HIERARCHY</text>
  </g>

  <g transform="translate(690, 460)">
    <text x="0" y="0" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#9AA58B">LEAD DESIGNER: SOUMYA K.</text>
    <text x="0" y="18" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#D8D0BD" opacity="0.6">CANVA VECTOR PRODUCTION</text>
  </g>
</svg>
