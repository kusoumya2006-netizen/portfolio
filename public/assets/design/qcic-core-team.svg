<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="qcicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17231F"/>
      <stop offset="60%" stop-color="#1F332B"/>
      <stop offset="100%" stop-color="#111B17"/>
    </linearGradient>
    <pattern id="qcicGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#9AA58B" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="600" height="750" fill="url(#qcicGrad)"/>
  <rect width="600" height="750" fill="url(#qcicGrid)"/>

  <!-- Border line -->
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="#9AA58B" stroke-width="1" opacity="0.4" rx="4"/>
  <rect x="35" y="35" width="530" height="680" fill="none" stroke="#B5B5AD" stroke-width="0.5" opacity="0.2"/>

  <!-- Header -->
  <text x="50" y="70" font-family="'Courier New', monospace" font-size="11" fill="#9AA58B" letter-spacing="4">SVCE // QCIC LEADERSHIP SERIES</text>
  <text x="550" y="70" text-anchor="end" font-family="'Courier New', monospace" font-size="11" fill="#D8D0BD" opacity="0.6">MOD-01 · 9 PAGES</text>

  <!-- Big Title -->
  <text x="50" y="140" font-family="Georgia, serif" font-size="44" fill="#D8D0BD" font-weight="bold">QCIC CORE</text>
  <text x="50" y="190" font-family="Georgia, serif" font-size="44" fill="#9AA58B" font-style="italic">TEAM 2026–27</text>
  <text x="50" y="225" font-family="'Courier New', monospace" font-size="12" fill="#B5B5AD" letter-spacing="2">QUANTUM COMPUTING &amp; INTELLIGENCE CLUB</text>

  <!-- Divider -->
  <line x1="50" y1="245" x2="550" y2="245" stroke="#9AA58B" stroke-width="1" opacity="0.4"/>

  <!-- Orbital Graphic Center -->
  <g transform="translate(300, 390)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#9AA58B" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="130" ry="45" fill="none" stroke="#D8D0BD" stroke-width="1.5" opacity="0.6" transform="rotate(25)"/>
    <ellipse cx="0" cy="0" rx="130" ry="45" fill="none" stroke="#9AA58B" stroke-width="1" opacity="0.5" transform="rotate(-35)"/>
    <circle cx="0" cy="0" r="14" fill="#D8D0BD"/>
    <circle cx="0" cy="0" r="7" fill="#17231F"/>
    
    <!-- Qubit satellite nodes -->
    <circle cx="118" cy="55" r="5" fill="#9AA58B"/>
    <circle cx="-105" cy="72" r="4" fill="#9AA58B" opacity="0.8"/>
    <circle cx="-90" cy="-65" r="4.5" fill="#D8D0BD" opacity="0.9"/>
  </g>

  <!-- Team Sections List -->
  <g transform="translate(50, 540)">
    <rect x="0" y="0" width="240" height="55" rx="4" fill="#17231F" stroke="#9AA58B" stroke-width="0.8" opacity="0.8"/>
    <text x="15" y="24" font-family="'Courier New', monospace" font-size="10" fill="#9AA58B" letter-spacing="2">TEAM 01</text>
    <text x="15" y="42" font-family="Arial, sans-serif" font-size="13" fill="#D8D0BD" font-weight="bold">Computing Team</text>

    <rect x="260" y="0" width="240" height="55" rx="4" fill="#17231F" stroke="#9AA58B" stroke-width="0.8" opacity="0.8"/>
    <text x="275" y="24" font-family="'Courier New', monospace" font-size="10" fill="#9AA58B" letter-spacing="2">TEAM 02</text>
    <text x="275" y="42" font-family="Arial, sans-serif" font-size="13" fill="#D8D0BD" font-weight="bold">Machine Learning Team</text>

    <rect x="0" y="65" width="240" height="55" rx="4" fill="#17231F" stroke="#9AA58B" stroke-width="0.8" opacity="0.8"/>
    <text x="15" y="89" font-family="'Courier New', monospace" font-size="10" fill="#9AA58B" letter-spacing="2">TEAM 03</text>
    <text x="15" y="107" font-family="Arial, sans-serif" font-size="13" fill="#D8D0BD" font-weight="bold">Marketing &amp; Design</text>

    <rect x="260" y="65" width="240" height="55" rx="4" fill="#17231F" stroke="#9AA58B" stroke-width="0.8" opacity="0.8"/>
    <text x="275" y="89" font-family="'Courier New', monospace" font-size="10" fill="#9AA58B" letter-spacing="2">TEAM 04</text>
    <text x="275" y="107" font-family="Arial, sans-serif" font-size="13" fill="#D8D0BD" font-weight="bold">Security &amp; Encoding</text>
  </g>

  <!-- Footer metadata -->
  <text x="50" y="700" font-family="'Courier New', monospace" font-size="11" fill="#9AA58B">DESIGN LEAD: SOUMYA K.</text>
  <text x="550" y="700" text-anchor="end" font-family="'Courier New', monospace" font-size="11" fill="#B5B5AD">CANVA PRODUCTION // 2026–27</text>
</svg>
